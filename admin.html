<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin | MUHAMMAD HUNAIN.AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
:root { --bg:#050a18; --surface:#0b1530; --surface-2:#101d40; --line:#1b2a55; --fg:#e8eefc; --muted:#9fb0d4; --accent:#22d3ee; --accent-2:#3b82f6; --danger:#f87171; --ok:#34d399; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 Inter, system-ui, sans-serif; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
h1,h2,h3 { font-family:"Space Grotesk", Inter, sans-serif; margin:0; }
code { background:var(--surface-2); padding:1px 6px; border-radius:6px; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 60px; }
header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:space-between; margin-bottom:20px; }
header h1 { font-size:22px; } header h1 b { color:var(--accent); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; }
label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:14px 0 4px; }
input[type=text], input[type=url], input[type=email], input[type=password], input[type=number], textarea { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
input:focus, textarea:focus, button:focus-visible, .tab:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.check { display:flex; align-items:center; gap:10px; margin-top:14px; }
.check input { width:18px; height:18px; accent-color: var(--accent); }
.check label { margin:0; text-transform:none; letter-spacing:0; font-size:14px; color:var(--fg); }
.hint { font-size:12px; color:var(--muted); margin-top:4px; }
button { cursor:pointer; font:inherit; font-weight:600; border:0; border-radius:999px; padding:10px 20px; color:#04111f; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
button.small { padding:6px 14px; font-size:13px; }
button.del { background:transparent; color:var(--danger); border:1px solid var(--line); padding:6px 14px; font-size:13px; }
button:disabled { opacity:.5; cursor:wait; }
.tabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px; }
.tab { white-space:nowrap; background:var(--surface); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-weight:500; }
.tab.on { color:#04111f; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-color:transparent; font-weight:600; }
.tab .n { opacity:.75; margin-left:6px; font-size:12px; }
.cols { display:grid; grid-template-columns: 1fr 1fr; gap:20px; align-items:start; }
.cols > * { min-width:0; }
@media (max-width:820px){ .cols{ grid-template-columns:1fr; } }
.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
.row:first-of-type { border-top:0; }
.row > .info { min-width:0; flex:1; }
.row .t { font-weight:600; overflow-wrap:anywhere; }
.row small { color:var(--muted); display:block; overflow-wrap:anywhere; }
.row .acts { display:flex; gap:8px; flex:none; }
.badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); margin-left:6px; vertical-align:middle; }
.badge.on { color:var(--ok); border-color:var(--ok); }
.msg { color:var(--muted); font-size:13px; margin-top:12px; min-height:1.3em; } .err { color:var(--danger); } .okm { color:var(--ok); }
.empty { color:var(--muted); padding:8px 0; }
.mbody { white-space:pre-wrap; margin-top:4px; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MUHAMMAD HUNAIN<b>.AI</b> admin</h1>
    <div style="display:flex;gap:8px"><a href="index.html" style="color:var(--accent);align-self:center">View site</a><button class="ghost small" id="logout" type="button" hidden>Sign out</button></div>
  </header>
 
  <div class="card" id="setup" hidden>
    <h2>Connect Supabase</h2>
    <p style="color:var(--muted)">Open <code>config.js</code> and paste your <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> (Supabase, Project Settings, API). Then reload this page.</p>
  </div>
 
  <form class="card" id="login" hidden style="max-width:420px">
    <h2>Sign in</h2>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    <p style="margin:18px 0 0"><button type="submit">Sign in</button></p>
    <div class="msg err" id="loginMsg"></div>
  </form>
 
  <main id="app" hidden>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="cols" id="work">
      <section class="card"><h2 id="listTitle"></h2><div id="list" style="margin-top:8px"></div></section>
      <section class="card">
        <h2 id="formTitle"></h2>
        <form id="form"></form>
      </section>
    </div>
  </main>
</div>
 
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var slugify = function (s) { return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); };
 
// What each tab edits. Add a field here and it appears in the form automatically.
var TABLES = {
  profile: { label: "Profile", single: true, order: null, title: function (r) { return r.full_name; },
    fields: [
      { k: "full_name", l: "Full name", t: "text" },
      { k: "role", l: "Role", t: "text" },
      { k: "about", l: "About me", t: "textarea" },
      { k: "github_url", l: "GitHub URL", t: "url" },
      { k: "linkedin_url", l: "LinkedIn URL", t: "url" },
      { k: "resume_url", l: "Resume link (PDF)", t: "url", hint: "Upload your PDF to Google Drive, set sharing to 'Anyone with the link', and paste the link here. A Download Resume button then appears on your site." }
    ] },
  projects: { label: "Projects", order: "sort_order", title: function (r) { return r.title; }, sub: function (r) { return r.subtitle; },
    badges: function (r) { return (r.featured ? ["Featured"] : []).concat(r.published ? [] : ["Hidden"]); },
    fields: [
      { k: "title", l: "Title", t: "text", req: true },
      { k: "subtitle", l: "Short label (e.g. AI SOC Analyst Platform)", t: "text" },
      { k: "description", l: "Description", t: "textarea" },
      { k: "tech_stack", l: "Tech stack", t: "list", hint: "Separate with commas: Python, FastAPI, NLP" },
      { k: "github_url", l: "GitHub URL", t: "url" },
      { k: "live_url", l: "Live demo URL", t: "url" },
      { k: "featured", l: "Featured (shown larger)", t: "bool" },
      { k: "published", l: "Visible on website", t: "bool", def: true },
      { k: "sort_order", l: "Order (1 shows first)", t: "number" }
    ] },
  skills: { label: "Skills", order: "sort_order", title: function (r) { return r.name; }, sub: function (r) { return r.category; },
    fields: [
      { k: "name", l: "Skill", t: "text", req: true },
      { k: "category", l: "Group", t: "text", def: "Core", hint: "Skills with the same group name appear together, e.g. Core, AI specialities, Engineering." },
      { k: "sort_order", l: "Order", t: "number" }
    ] },
  education: { label: "Education", order: "sort_order", title: function (r) { return r.degree; }, sub: function (r) { return r.institution + " (" + (r.start_year || "") + " to " + (r.end_year || "present") + ")"; },
    fields: [
      { k: "degree", l: "Degree", t: "text", req: true },
      { k: "institution", l: "Institution", t: "text", req: true },
      { k: "start_year", l: "Start year", t: "number" },
      { k: "end_year", l: "End year", t: "number", hint: "Leave empty if you are still studying." },
      { k: "sort_order", l: "Order", t: "number" }
    ] },
  certificates: { label: "Certificates", order: "sort_order", title: function (r) { return r.title; }, sub: function (r) { return r.issuer; },
    badges: function (r) { return r.published ? [] : ["Hidden"]; },
    fields: [
      { k: "title", l: "Certificate title", t: "text", req: true },
      { k: "issuer", l: "Issued by", t: "text", req: true },
      { k: "credential_url", l: "Verification link", t: "url" },
      { k: "published", l: "Visible on website", t: "bool", def: true },
      { k: "sort_order", l: "Order", t: "number" }
    ] },
  messages: { label: "Messages", readonly: true, order: "created_at", desc: true }
};
 
var db, current = "profile", rows = [], editing = null, counts = {};
 
function setup() {
  if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) { $("setup").hidden = false; return; }
  db = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  db.auth.onAuthStateChange(function (_e, s) { show(s); });
  db.auth.getSession().then(function (r) { show(r.data.session); });
}
function show(session) {
  $("login").hidden = !!session; $("app").hidden = !session; $("logout").hidden = !session;
  if (session) { buildTabs(); openTab(current); refreshCounts(); }
}
$("login").addEventListener("submit", function (e) {
  e.preventDefault();
  db.auth.signInWithPassword({ email: $("email").value, password: $("password").value }).then(function (r) { $("loginMsg").textContent = r.error ? r.error.message : ""; });
});
$("logout").addEventListener("click", function () { db.auth.signOut(); });
 
function buildTabs() {
  $("tabs").innerHTML = Object.keys(TABLES).map(function (k) {
    return '<button type="button" class="tab' + (k === current ? " on" : "") + '" role="tab" data-tab="' + k + '">' + TABLES[k].label + '<span class="n" id="n-' + k + '"></span></button>';
  }).join("");
}
$("tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (b) openTab(b.dataset.tab); });
 
function refreshCounts() {
  Object.keys(TABLES).forEach(function (k) {
    if (TABLES[k].single) return;
    var q = db.from(k).select("id", { count: "exact", head: true });
    if (k === "messages") q = q.eq("read", false);
    q.then(function (r) { var el = $("n-" + k); if (el && r.count != null) el.textContent = r.count; });
  });
}
 
function openTab(k) {
  current = k; editing = null;
  [].forEach.call(document.querySelectorAll(".tab"), function (t) { t.classList.toggle("on", t.dataset.tab === k); });
  var T = TABLES[k];
  $("listTitle").textContent = T.label;
  $("work").style.gridTemplateColumns = T.readonly ? "1fr" : "";
  document.querySelector("#work > section:last-child").hidden = !!T.readonly;
  load();
}
 
function load() {
  var T = TABLES[current], q = db.from(current).select("*");
  if (T.single) q = q.eq("id", 1);
  else if (T.order) q = q.order(T.order, { ascending: !T.desc });
  q.then(function (r) {
    if (r.error) { $("list").innerHTML = '<p class="msg err">' + esc(r.error.message) + '</p>'; return; }
    rows = r.data || [];
    if (T.single) editing = rows[0] || {};
    renderList(); renderForm();
  });
}
 
function renderList() {
  var T = TABLES[current], el = $("list");
  if (T.single) { el.innerHTML = '<p class="hint">Your main details. Edit them on the right and save.</p>'; return; }
  if (!rows.length) { el.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }
  if (current === "messages") {
    el.innerHTML = rows.map(function (m) {
      return '<div class="row"><div class="info"><div class="t">' + esc(m.name) + (m.read ? '' : '<span class="badge on">New</span>') + '</div><small>' + esc(m.email) + ' &middot; ' + new Date(m.created_at).toLocaleString() + '</small><div class="mbody">' + esc(m.body) + '</div></div>' +
        '<div class="acts"><button class="ghost small" data-read="' + m.id + '" data-val="' + (!m.read) + '" type="button">' + (m.read ? "Mark unread" : "Mark read") + '</button><button class="del" data-del="' + m.id + '" type="button">Delete</button></div></div>';
    }).join(""); return;
  }
  el.innerHTML = rows.map(function (r) {
    var badges = (T.badges ? T.badges(r) : []).map(function (b) { return '<span class="badge">' + b + '</span>'; }).join("");
    return '<div class="row"><div class="info"><div class="t">' + esc(T.title(r)) + badges + '</div>' + (T.sub ? '<small>' + esc(T.sub(r)) + '</small>' : '') + '</div>' +
      '<div class="acts"><button class="ghost small" data-edit="' + r.id + '" type="button">Edit</button><button class="del" data-del="' + r.id + '" type="button">Delete</button></div></div>';
  }).join("");
}
 
function renderForm() {
  var T = TABLES[current]; if (T.readonly) return;
  var isNew = !editing || (!T.single && !editing.id);
  $("formTitle").textContent = T.single ? "Edit profile" : (isNew ? "Add new" : "Edit item");
  var v = editing || {};
  var html = T.fields.map(function (f) {
    var val = v[f.k]; if (val == null && isNew && f.def !== undefined) val = f.def;
    var id = "f_" + f.k, hint = f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : "";
    if (f.t === "bool") return '<div class="check"><input type="checkbox" id="' + id + '"' + (val ? " checked" : "") + '><label for="' + id + '">' + esc(f.l) + '</label></div>';
    var common = ' id="' + id + '"' + (f.req ? " required" : "");
    if (f.t === "textarea") return '<label for="' + id + '">' + esc(f.l) + '</label><textarea' + common + ' rows="5">' + esc(val) + '</textarea>' + hint;
    if (f.t === "list") return '<label for="' + id + '">' + esc(f.l) + '</label><input type="text"' + common + ' value="' + esc((val || []).join(", ")) + '">' + hint;
    return '<label for="' + id + '">' + esc(f.l) + '</label><input type="' + (f.t === "number" ? "number" : f.t) + '"' + common + ' value="' + esc(val) + '">' + hint;
  }).join("");
  html += '<p style="margin:20px 0 0;display:flex;gap:10px;flex-wrap:wrap"><button type="submit" id="save">' + (isNew ? "Add" : "Save changes") + '</button>' + (!T.single && !isNew ? '<button type="button" class="ghost" id="cancel">Cancel</button>' : "") + '</p><div class="msg" id="fmsg" role="status"></div>';
  $("form").innerHTML = html;
}
 
$("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var T = TABLES[current], out = {};
  T.fields.forEach(function (f) {
    var el = $("f_" + f.k), v;
    if (f.t === "bool") v = el.checked;
    else if (f.t === "list") v = el.value.split(",").map(function (x) { return x.trim(); }).filter(Boolean);
    else if (f.t === "number") v = el.value === "" ? (f.k === "sort_order" ? 0 : null) : Number(el.value);
    else v = el.value.trim() === "" ? (f.req ? "" : null) : el.value.trim();
    out[f.k] = v;
  });
  var btn = $("save"), msg = $("fmsg"); btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving...";
  var p;
  if (T.single) { out.id = 1; out.updated_at = new Date().toISOString(); p = db.from(current).upsert(out); }
  else if (editing && editing.id) p = db.from(current).update(out).eq("id", editing.id);
  else { if (current === "projects") out.slug = slugify(out.title); p = db.from(current).insert(out); }
  p.then(function (r) {
    if (r.error) { msg.className = "msg err"; msg.textContent = r.error.message + (/row-level|policy/i.test(r.error.message) ? " (your user must be added to the admins table)" : ""); btn.disabled = false; return; }
    editing = null; load(); refreshCounts();
    var m2 = $("fmsg"); if (m2) { m2.className = "msg okm"; m2.textContent = "Saved. Your website now shows the change."; }
  });
});
 
$("work").addEventListener("click", function (e) {
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.edit) { editing = rows.filter(function (r) { return String(r.id) === t.dataset.edit; })[0]; renderForm(); $("form").scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  else if (t.id === "cancel") { editing = null; renderForm(); }
  else if (t.dataset.del) {
    if (t.dataset.sure !== "1") { t.dataset.sure = "1"; t.textContent = "Sure? Click again"; setTimeout(function () { t.dataset.sure = ""; t.textContent = "Delete"; }, 3000); return; }
    db.from(current).delete().eq("id", t.dataset.del).then(function () { load(); refreshCounts(); });
  }
  else if (t.dataset.read) db.from("messages").update({ read: t.dataset.val === "true" }).eq("id", t.dataset.read).then(function () { load(); refreshCounts(); });
});
 
setup();
</script>
</body>
</html>
